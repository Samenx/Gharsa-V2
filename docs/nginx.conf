# Substitute your domain, certificate configuration, and deployment directory.
server {
    listen 80;
    server_name gharsa.example;
    root /srv/gharsa/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:5000; }
    location = /robots.txt { proxy_pass http://127.0.0.1:5000; }
    location / { try_files $uri $uri/ /index.html; }
}
